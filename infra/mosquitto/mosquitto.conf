# ═══════════════════════════════════════════════════════════
# ModESP Cloud — Mosquitto with mosquitto-go-auth
# Place in: /etc/mosquitto/conf.d/modesp.conf
# ═══════════════════════════════════════════════════════════

per_listener_settings true

# ── Listener 1: Backend (localhost, no auth) ──────────────
listener 1883 127.0.0.1
allow_anonymous true

# ── Listener 2: ESP32 devices (TLS + plugin auth) ────────
listener 8883 0.0.0.0
allow_anonymous false

# TLS (Let's Encrypt certs — copy fullchain.pem + privkey.pem to /etc/mosquitto/certs/)
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# Auth plugin (mosquitto-go-auth with PostgreSQL)
auth_plugin /usr/lib/mosquitto/go-auth.so
auth_opt_backends postgres
auth_opt_hasher bcrypt
auth_opt_hasher_cost 12

# Cache (reduces DB queries)
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_auth_cache_seconds 5
auth_opt_acl_cache_seconds 60
auth_opt_auth_jitter_seconds 2
auth_opt_acl_jitter_seconds 5

# PostgreSQL (read-only user)
auth_opt_pg_host localhost
auth_opt_pg_port 5432
auth_opt_pg_dbname modesp_cloud
auth_opt_pg_user modesp_mqtt_ro
# backend/scripts/deploy-mqtt-auth.sh copies THIS file to /etc/mosquitto/conf.d/modesp.conf
# and rewrites the placeholder line below with the real password. It is the only line the
# deployment is allowed to change — keep the leading '# auth_opt_pg_password' intact or the
# deploy aborts. Never edit the broker's copy by hand; edit this file and redeploy.
# auth_opt_pg_password <SET_VIA_DEPLOYMENT_SCRIPT>
auth_opt_pg_sslmode disable
auth_opt_pg_connect_tries 5

# ── SQL Queries ───────────────────────────────────────────

# User query: bcrypt hash by mqtt_username
# Two priorities, ORDER BY priority LIMIT 1 — the FIRST match wins:
#   1. the device's own row, whenever it has a hash and is not 'disabled'.
#      NOTE: there is deliberately NO online/recency condition here. If the DB holds
#      a hash the device never received (an assign rotated it while the device was
#      offline — see src/routes/devices.js), priority 1 still wins and the device is
#      refused; the bootstrap fallback below is NOT reached. Such a device recovers
#      through POST /api/devices/register (firmware retries it after 3 auth failures),
#      which resets the row to 'pending' with the bootstrap hash.
#   2. the shared mqtt_bootstrap hash, for a username with no usable devices row —
#      reflashed / unknown / soft-deleted devices. Suppressed when the row is
#      'disabled' (an operator revocation must not be undone by the shared key) and
#      when a live non-deleted row already owns the username.
auth_opt_pg_userquery SELECT password_hash FROM (SELECT mqtt_password_hash AS password_hash, 1 AS priority FROM devices WHERE mqtt_username = $1 AND status != 'disabled' AND mqtt_password_hash IS NOT NULL UNION ALL SELECT password_hash, 2 AS priority FROM mqtt_bootstrap WHERE id = 1 AND $1 ~ '^device_[A-Fa-f0-9]{6,12}$' AND NOT EXISTS (SELECT 1 FROM devices WHERE mqtt_username = $1 AND status = 'disabled') AND NOT EXISTS (SELECT 1 FROM devices WHERE mqtt_username = $1 AND status NOT IN ('disabled', 'deleted') AND online = true)) combined ORDER BY priority LIMIT 1

# Superuser: nobody (backend connects on localhost without plugin)
# Must accept $1 (username) parameter even though not used
auth_opt_pg_superquery SELECT COUNT(*) FROM devices WHERE mqtt_username = $1 AND 1 = 0

# ACL query: access levels via $2 (1=read, 2=publish, 4=subscribe in mosquitto 2.0+)
# Device can:
#   publish (2):   state/+, status, heartbeat, backfill, backfill/events, backfill/done
#   subscribe/read (1,4): cmd/+
# With bootstrap fallback: deleted/unknown devices get pending namespace ACL.
# Note: ($2 = 4 AND acl.rw = 1) maps SUBSCRIBE checks to READ permissions for cmd/+
#
# Three UNION ALL branches, in order:
#   1. status-derived prefix — pending/deleted -> modesp/v1/pending/<id>,
#      active -> modesp/v1/<tenant_slug>/<id>. 'disabled' matches nothing here.
#   2. bootstrap fallback — a username with no devices row at all gets the pending
#      namespace so a reflashed/unknown device can be discovered. The id is stripped
#      with regexp_replace($1, '^device_', ''), ANCHORED on purpose: the unanchored
#      REPLACE() this replaced collapsed 'device_device_ABC' to 'ABC', so a holder of
#      the shared bootstrap password could claim ANY device's pending prefix by
#      doubling the prefix (no devices row carries the doubled username, so the
#      NOT EXISTS guard passed and the userquery handed out the bootstrap hash).
#      The NOT EXISTS list includes 'disabled' so an operator-revoked row cannot fall
#      through to the shared-credential namespace.
#   3. SELF-CLOSING pending grant (migration 022) — an ACTIVE device that has not yet
#      checked in under its own tenant prefix ALSO keeps modesp/v1/pending/<its own id>.
#      Without it, a device that missed _set_tenant is deadlocked: it still publishes and
#      subscribes on the pending prefix, but the DB already says 'active', so branch 1
#      revoked that prefix — and autoReassignDevice's rescue command, which is published
#      (retained) to the pending prefix, can no longer reach it either.
#      Gated on assigned_at IS NOT NULL: an active row that never went through an assign
#      (src/scripts/provision-demo-fleet.js writes such rows, status='active' with
#      last_seen NULL) was never on the pending prefix and so has no deadlock to break.
#      Without that gate the `last_seen IS NULL` disjunct short-circuits and grants those
#      rows the pending prefix forever.
#      Gated on deleted_at IS NULL so a soft-deleted row can never reach it, independently
#      of the delete handlers always writing status and deleted_at together.
#      The grant closes by itself: last_seen only advances when the batched writer in
#      services/mqtt.js matches d.tenant_id to the tenant slug on the topic, which cannot
#      happen while the device is stuck on 'pending'. One successful publish under the real
#      tenant pushes last_seen past assigned_at and the branch stops returning rows.
#      (That invariant only holds because the writer stamps the OBSERVED timestamp, not
#      NOW() — see stateWriter in services/mqtt.js. An admin action must never be able to
#      synthesise a check-in the device did not make.)
#      Bound: keyed on mqtt_username, which is UNIQUE (idx_devices_mqtt_username), and the
#      topic is built from that same row's mqtt_device_id — a device can only ever be
#      granted its OWN pending prefix, never another device's and never another tenant's
#      namespace. NOTE: auth_opt_acl_cache_seconds 60 delays any change here by up to 1 min.
auth_opt_pg_aclquery SELECT sub.prefix || acl.suffix FROM (SELECT CASE WHEN d.status = 'pending' THEN 'modesp/v1/pending/' || d.mqtt_device_id WHEN d.status = 'active' THEN 'modesp/v1/' || t.slug || '/' || d.mqtt_device_id WHEN d.status = 'deleted' THEN 'modesp/v1/pending/' || d.mqtt_device_id END AS prefix FROM devices d LEFT JOIN tenants t ON t.id = d.tenant_id WHERE d.mqtt_username = $1 AND d.status IN ('pending', 'active', 'deleted')) sub CROSS JOIN (SELECT '/state/+' AS suffix, 2 AS rw UNION ALL SELECT '/status', 2 UNION ALL SELECT '/heartbeat', 2 UNION ALL SELECT '/backfill', 2 UNION ALL SELECT '/backfill/events', 2 UNION ALL SELECT '/backfill/done', 2 UNION ALL SELECT '/cmd/+', 1) acl WHERE (acl.rw = $2 OR ($2 = 4 AND acl.rw = 1)) AND sub.prefix IS NOT NULL UNION ALL SELECT 'modesp/v1/pending/' || regexp_replace($1, '^device_', '') || acl.suffix FROM (SELECT '/state/+' AS suffix, 2 AS rw UNION ALL SELECT '/status', 2 UNION ALL SELECT '/heartbeat', 2 UNION ALL SELECT '/backfill', 2 UNION ALL SELECT '/backfill/events', 2 UNION ALL SELECT '/backfill/done', 2 UNION ALL SELECT '/cmd/+', 1) acl WHERE $1 ~ '^device_[A-Fa-f0-9]{6,12}$' AND (acl.rw = $2 OR ($2 = 4 AND acl.rw = 1)) AND NOT EXISTS (SELECT 1 FROM devices WHERE mqtt_username = $1 AND status IN ('pending', 'active', 'deleted', 'disabled')) UNION ALL SELECT 'modesp/v1/pending/' || d.mqtt_device_id || acl.suffix FROM devices d CROSS JOIN (SELECT '/state/+' AS suffix, 2 AS rw UNION ALL SELECT '/status', 2 UNION ALL SELECT '/heartbeat', 2 UNION ALL SELECT '/backfill', 2 UNION ALL SELECT '/backfill/events', 2 UNION ALL SELECT '/backfill/done', 2 UNION ALL SELECT '/cmd/+', 1) acl WHERE d.mqtt_username = $1 AND d.status = 'active' AND d.deleted_at IS NULL AND d.assigned_at IS NOT NULL AND (d.last_seen IS NULL OR d.last_seen <= d.assigned_at) AND (acl.rw = $2 OR ($2 = 4 AND acl.rw = 1))

# ── Persistence + Logging ─────────────────────────────────
persistence true
persistence_location /var/lib/mosquitto/
persistence_file mosquitto.db

# ── Logging ───────────────────────────────────────────────
log_dest syslog
log_type error
log_type warning
connection_messages true

# ── Limits ────────────────────────────────────────────────
max_connections 500
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 1024
