# ModESP Cloud — journald limits
# Install: /etc/systemd/journald.conf.d/modesp.conf, then systemctl restart systemd-journald
# Every ModESP unit logs to the journal (backend at info level, batches at debug);
# without a cap the journal can grow past the 40 GB CX22 disk over a year.
[Journal]
SystemMaxUse=500M
MaxRetentionSec=30day
