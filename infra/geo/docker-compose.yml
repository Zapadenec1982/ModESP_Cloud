# Self-hosted geo services for ModESP Cloud (plan epic 1.2).
#
# Runs on the staging/demo server (or any box with ~4 GB RAM and ~20 GB disk):
# OSRM for routes and service-round planning, Nominatim for geocoding — both on
# the Ukraine extract, bound to localhost only. Production's backend reaches
# them through a private network or an SSH tunnel; see README.md here.
#
#   cd infra/geo && ./prepare-osrm.sh      # one-off: download + preprocess the extract
#   docker compose up -d                   # Nominatim imports on first start (~1-2 h)
#
# Backend .env afterwards:
#   OSRM_URL=http://127.0.0.1:5000
#   GEOCODER_URL=http://127.0.0.1:8080
#   GEOCODER_BULK_ENABLED=true     # own instance — bulk geocoding is allowed here

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: modesp-osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/ukraine-latest.osrm
    volumes:
      - ./data/osrm:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:5000/route/v1/driving/30.52,50.45;30.53,50.46' | grep -q '\"code\":\"Ok\"'"]
      interval: 60s
      timeout: 10s
      retries: 3

  nominatim:
    image: mediagis/nominatim:4.4
    container_name: modesp-nominatim
    restart: unless-stopped
    environment:
      PBF_URL: https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/europe/ukraine-updates/
      REPLICATION_UPDATE_INTERVAL: "86400"
      IMPORT_WIKIPEDIA: "false"
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-change-me}
      THREADS: "4"
    volumes:
      - ./data/nominatim:/var/lib/postgresql/16/main
      - ./data/nominatim-flatnode:/nominatim/flatnode
    ports:
      - "127.0.0.1:8080:8080"
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:8080/status' | grep -q OK"]
      interval: 60s
      timeout: 10s
      retries: 10
