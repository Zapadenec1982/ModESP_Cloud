# ModESP Cloud — Nginx rate-limit zone
# Install to: /etc/nginx/conf.d/modesp-ratelimit.conf
# Loaded automatically in the http block; defines the zone referenced by
# modesp.conf (limit_req zone=api ...). Shipping it as a dedicated conf.d file
# means a clean deploy of modesp.conf alone no longer fails `nginx -t` with
# "zone api is not defined".

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
